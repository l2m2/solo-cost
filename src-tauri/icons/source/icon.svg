<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Source of truth for the app icon. Regenerate the PNG/ICNS/ICO set with:
       pnpm tauri icon src-tauri/icons/source/icon-1024.png
       (render this file to icon-1024.png first; see README in this folder) -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26221D"/>
      <stop offset="1" stop-color="#151310"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B23A2E"/>
      <stop offset="1" stop-color="#3B4A6B"/>
    </linearGradient>

    <!-- Interior of the glass. Both sand and coins are clipped to it, so the
         chamber walls do the tapering instead of hand-tuned funnel shapes. -->
    <clipPath id="chamber">
      <path d="M 349,317
               C 349,410 493,444 493,512
               C 493,580 349,614 349,707
               L 675,707
               C 675,614 531,580 531,512
               C 531,444 675,410 675,317 Z"/>
    </clipPath>
  </defs>

  <!-- Rounded plate, inset to Apple's icon grid so the macOS dock lines up -->
  <rect x="72" y="72" width="880" height="880" rx="197" fill="url(#plate)"/>

  <!-- Glass wall: outer silhouette minus inner silhouette -->
  <path fill="#F7F4EC" fill-rule="evenodd"
        d="M 332,300
           C 332,406 476,440 476,512
           C 476,584 332,618 332,724
           L 692,724
           C 692,618 548,584 548,512
           C 548,440 692,406 692,300 Z
           M 349,317
           C 349,410 493,444 493,512
           C 493,580 349,614 349,707
           L 675,707
           C 675,614 531,580 531,512
           C 531,444 675,410 675,317 Z"/>

  <g clip-path="url(#chamber)">
    <!-- Time still to spend: vermilion sand, surface dished where it drains -->
    <path fill="#B23A2E" d="M 320,392 Q 512,448 704,392 L 704,520 L 320,520 Z"/>
    <path fill="#C85446" d="M 320,392 Q 512,448 704,392 L 704,420 Q 512,476 320,420 Z"/>

    <!-- What it turned into: three coins, each sized to the chamber width at
         its own depth, so the stack both reads as coins and settles like a pile -->
    <g fill="#44557B">
      <!-- Floor bed: the widest coin still can't be wider than the chamber, so
           this fills the corners the stack leaves dark -->
      <path d="M 320,712 L 704,712 L 704,676 Q 512,654 320,676 Z"/>
      <ellipse cx="512" cy="706" rx="145" ry="36"/>
      <rect x="367" y="660" width="290" height="46"/>
      <ellipse cx="512" cy="660" rx="100" ry="25"/>
      <rect x="412" y="616" width="200" height="44"/>
      <ellipse cx="512" cy="616" rx="60" ry="15"/>
      <rect x="452" y="578" width="120" height="38"/>
    </g>
    <g fill="#6E82AD">
      <ellipse cx="512" cy="660" rx="145" ry="36"/>
      <ellipse cx="512" cy="616" rx="100" ry="25"/>
      <ellipse cx="512" cy="578" rx="60" ry="15"/>
    </g>

    <!-- The grain in transit: vermilion going in, indigo coming out -->
    <rect x="502" y="520" width="20" height="48" rx="10" fill="url(#stream)"/>
  </g>

  <!-- Frame caps -->
  <rect x="300" y="250" width="424" height="52" rx="26" fill="#F7F4EC"/>
  <rect x="300" y="722" width="424" height="52" rx="26" fill="#F7F4EC"/>
</svg>
