name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tauri crate links against webkit/gtk at build time, so the Rust
      # tests need these even though they only exercise db/domain logic.
      # Same list as the Linux prerequisites in README.md.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable

      # rusqlite is built with bundled-sqlcipher-vendored-openssl, which compiles
      # OpenSSL and SQLCipher from source. Without this cache every run pays that
      # cost again.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # No frontend build first: tauri_build::build() does not need dist/ to
      # exist for `cargo test`, so this job stays independent of the other one.
      - name: Run tests
        working-directory: src-tauri
        run: cargo test --locked
